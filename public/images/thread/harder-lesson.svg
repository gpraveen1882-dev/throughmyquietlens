<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">A harder lesson</title><desc id="d">A faithful web recreation of the personal-brand journey slide about response and consistency.</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<text x="28" y="42" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b17c3f">A HARDER LESSON</text>
<text x="28" y="126" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#171717">I initially looked for response. I learned consistency.</text>
<text x="28" y="216" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#171717">This was probably the least comfortable part of the journey and maybe the most useful.</text>
<rect x="52" y="286" width="690" height="450" rx="10" fill="#ffffff" stroke="#ded4c7" stroke-width="2"/>
<text x="96" y="365" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#b17c3f">At first</text>
<text x="96" y="448" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#111">
<tspan x="96" dy="0">I would spend hours on a piece, share it,</tspan><tspan x="96" dy="46">and naturally hope it would matter to</tspan><tspan x="96" dy="46">someone.</tspan>
<tspan x="96" dy="86">I slowly learned that response could not</tspan><tspan x="96" dy="46">become the reason I wrote.</tspan>
</text>
<rect x="806" y="286" width="742" height="450" rx="10" fill="#e7ece8" stroke="#cfd8d1" stroke-width="2"/>
<text x="854" y="365" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#65756b">What changed</text>
<text x="854" y="448" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#111">
<tspan x="854" dy="0">I had to make peace with the quiet.</tspan>
<tspan x="854" dy="72">People are busy. Some people read quietly.</tspan><tspan x="854" dy="46">Reciprocity is never guaranteed. If</tspan><tspan x="854" dy="46">something felt honest and worth saying, I</tspan><tspan x="854" dy="46">had to keep putting it out there even when it</tspan><tspan x="854" dy="46">was quiet.</tspan>
</text>
<text x="800" y="852" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b17c3f">Response ≠ resonance</text>
</svg>