<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Where it led</title><desc id="d">A faithful web recreation of the slide showing the transition from a brand statement to Through My Quiet Lens.</desc>
<rect width="1600" height="900" fill="#f5f1e9"/>
<text x="28" y="42" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b17c3f">WHERE IT LED</text>
<text x="28" y="128" font-family="Georgia,'Times New Roman',serif" font-size="58" fill="#26231f">From a statement to a space.</text>
<text x="28" y="208" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#736d65">The website was not the objective. It became an outcome of the trail that had already formed.</text>
<line x1="28" y1="268" x2="1572" y2="268" stroke="#e6ddd2" stroke-width="2"/>
<text x="860" y="352" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#2d2924">Through My Quiet Lens</text>
<text x="860" y="438" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#736d65">
<tspan x="860" dy="0">A home for 50+ short and long-form pieces —</tspan><tspan x="860" dy="44">business, leadership, relationships, education,</tspan><tspan x="860" dy="44">culture, technology and ordinary moments from life.</tspan>
</text>
<line x1="860" y1="588" x2="1518" y2="588" stroke="#b98143" stroke-width="3"/>
<text x="860" y="676" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#65756b">I started by trying to define my personal brand.</text>
<text x="860" y="746" font-family="Georgia,'Times New Roman',serif" font-size="38" font-style="italic" fill="#2d2924">
<tspan x="860" dy="0">Eventually, I built a place where parts of it</tspan><tspan x="860" dy="50">could simply be seen.</tspan>
</text>
<g transform="translate(36 310)">
<rect width="742" height="480" fill="#fbfaf6" stroke="#dfd7cb" stroke-width="2"/>
<text x="36" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-style="italic" fill="#2d2924">Through My Quiet Lens.</text>
<line x1="24" y1="74" x2="718" y2="74" stroke="#e3ddd3"/>
<rect x="24" y="144" width="292" height="278" fill="#d7d0c6"/>
<circle cx="170" cy="242" r="74" fill="#899289"/><circle cx="215" cy="304" r="34" fill="#ece9e1"/>
<text x="364" y="144" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#65756b">BEHIND THE LENS</text>
<text x="364" y="202" font-family="Georgia,'Times New Roman',serif" font-size="44" fill="#263026"><tspan x="364" dy="0">A life shaped by</tspan><tspan x="364" dy="48">work, learning,</tspan><tspan x="364" dy="48">movement and</tspan><tspan x="364" dy="48">reflection.</tspan></text>
<text x="364" y="424" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#67645f">A place for writing, questions and unfinished ideas.</text>
</g>
</svg>